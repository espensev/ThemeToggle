# WinGet / Release Workflow Validation
# Validates winget manifests and the canonical release flow on changes

name: Validate WinGet Release Flow

on:
  push:
    paths:
      - 'winget/**'
      - 'tools/validate-winget.ps1'
      - 'tools/validate-release-workflow.ps1'
      - 'tools/bump-version.ps1'
      - 'tools/release/**'
      - 'tools/signing/README.md'
      - 'docs/RELEASE.md'
      - 'docs/DEVELOPMENT.md'
      - '.github/RELEASE_TEMPLATE.md'
      - '.github/workflows/validate-winget.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/winget-publish.yml'
  pull_request:
    paths:
      - 'winget/**'
      - 'tools/validate-winget.ps1'
      - 'tools/validate-release-workflow.ps1'
      - 'tools/bump-version.ps1'
      - 'tools/release/**'
      - 'tools/signing/README.md'
      - 'docs/RELEASE.md'
      - 'docs/DEVELOPMENT.md'
      - '.github/RELEASE_TEMPLATE.md'
      - '.github/workflows/validate-winget.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/winget-publish.yml'

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate manifest schema
        run: |
          .\tools\validate-winget.ps1 `
            -RepoSlug "${{ github.repository }}"
        shell: pwsh

      - name: Validate release workflow invariants
        run: |
          .\tools\validate-release-workflow.ps1
        shell: pwsh

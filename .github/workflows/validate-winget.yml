# WinGet Manifest Validation
# Validates winget manifests on changes

name: Validate WinGet Manifests

on:
  push:
    paths:
      - 'winget/**'
  pull_request:
    paths:
      - 'winget/**'

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install winget-create
        run: |
          # Install wingetcreate for validation
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"
        shell: pwsh

      - name: Validate manifest schema
        run: |
          echo "Validating WinGet manifest files..."

          $manifestDir = "winget"
          $version = (Get-Content "VERSION" -Raw).Trim()

          # Check all required files exist
          $requiredFiles = @(
            "SevIQ.ThemeToggle.yaml",
            "SevIQ.ThemeToggle.installer.yaml",
            "SevIQ.ThemeToggle.locale.en-US.yaml"
          )

          foreach ($file in $requiredFiles) {
            $path = Join-Path $manifestDir $file
            if (Test-Path $path) {
              echo "[OK] Found: $file"
            } else {
              Write-Error "Missing required manifest: $file"
              exit 1
            }
          }

          # Validate YAML structure
          foreach ($file in $requiredFiles) {
            $path = Join-Path $manifestDir $file
            $content = Get-Content $path -Raw

            # Check for common issues
            if ($content -match "REPLACE_WITH") {
              Write-Error "$file contains placeholder values (REPLACE_WITH...)"
              exit 1
            }

            if ($content -match '\$\d') {
              Write-Error "$file contains corrupted regex backreferences"
              exit 1
            }

            # Check PackageVersion consistency
            if ($content -match "PackageVersion:\s*(\S+)") {
              $manifestVersion = $matches[1]
              if ($manifestVersion -ne $version) {
                Write-Warning "$file has version $manifestVersion, expected $version"
              } else {
                echo "[OK] $file version: $manifestVersion"
              }
            }
          }

          echo ""
          echo "All manifest validations passed!"
        shell: pwsh

      - name: Validate installer manifest details
        run: |
          $installerYaml = Get-Content "winget/SevIQ.ThemeToggle.installer.yaml" -Raw

          # Check required fields
          $requiredFields = @(
            "PackageIdentifier",
            "PackageVersion",
            "InstallerType",
            "InstallerUrl",
            "InstallerSha256"
          )

          echo "Checking required fields in installer manifest..."

          foreach ($field in $requiredFields) {
            if ($installerYaml -match "$field`:") {
              echo "[OK] $field present"
            } else {
              Write-Error "Missing required field: $field"
              exit 1
            }
          }

          # Validate SHA256 format (64 hex characters)
          if ($installerYaml -match "InstallerSha256:\s*([A-Fa-f0-9]{64})") {
            echo "[OK] SHA256 hash format valid"
          } else {
            Write-Error "Invalid SHA256 hash format"
            exit 1
          }

          # Validate URL format
          if ($installerYaml -match "InstallerUrl:\s*(https://github\.com/espensev/ThemeToggle/releases/download/v[\d.]+/ThemeToggle-Setup-[\d.]+\.exe)") {
            echo "[OK] Installer URL format valid: $($matches[1])"
          } else {
            Write-Warning "Installer URL may not match expected format"
          }

          echo ""
          echo "Installer manifest validation complete!"
        shell: pwsh

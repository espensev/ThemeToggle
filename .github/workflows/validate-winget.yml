# WinGet Manifest Validation
# Validates winget manifests on changes

name: Validate WinGet Manifests

on:
  push:
    paths:
      - 'winget/**'
      - 'tools/validate-winget.ps1'
      - 'tools/bump-version.ps1'
      - 'tools/release/**'
      - '.github/workflows/validate-winget.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/winget-publish.yml'
  pull_request:
    paths:
      - 'winget/**'
      - 'tools/validate-winget.ps1'
      - 'tools/bump-version.ps1'
      - 'tools/release/**'
      - '.github/workflows/validate-winget.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/winget-publish.yml'

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate manifest schema
        run: |
          .\tools\validate-winget.ps1 `
            -RepoSlug "${{ github.repository }}"
        shell: pwsh

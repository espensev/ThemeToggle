# WinGet Manifest Validation
# Validates winget manifests on changes

name: Validate WinGet Manifests

on:
  push:
    paths:
      - 'winget/**'
  pull_request:
    paths:
      - 'winget/**'

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manifest schema
        run: |
          .\tools\validate-winget.ps1 `
            -RepoSlug "${{ github.repository }}"
        shell: pwsh

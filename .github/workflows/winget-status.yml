# WinGet PR Status Tracker
# Checks open PRs on microsoft/winget-pkgs daily and posts updates

name: WinGet PR Status

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: '0 9 * * *'

  # Allow manual check
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-status:
    runs-on: ubuntu-latest

    steps:
      - name: Check WinGet PR status
        run: |
          AUTHOR="espensev"
          API="https://api.github.com"

          echo "Checking for open WinGet PRs by $AUTHOR..."

          # All repos are public — no auth needed for reads
          # List branches on the user's winget-pkgs fork
          FORK_BRANCHES=$(curl -sf -H "Accept: application/vnd.github+json" \
            "${API}/repos/${AUTHOR}/winget-pkgs/branches?per_page=100" \
            | jq -r '[.[] | .name | select(startswith("SevIQ.ThemeToggle"))] | .[]') || true

          # For each branch, check if there's an open PR
          OPEN_PRS="[]"
          for BRANCH in $FORK_BRANCHES; do
            PR_DATA=$(curl -sf -H "Accept: application/vnd.github+json" \
              "${API}/repos/microsoft/winget-pkgs/pulls?state=open&head=${AUTHOR}:${BRANCH}" \
              | jq '[.[] | {number, title, url: .html_url, createdAt: .created_at}]') || continue

            PR_COUNT=$(echo "$PR_DATA" | jq 'length')
            if [ "$PR_COUNT" -gt 0 ]; then
              OPEN_PRS=$(echo "$OPEN_PRS" "$PR_DATA" | jq -s 'add')
            fi
          done

          OPEN_COUNT=$(echo "$OPEN_PRS" | jq 'length')

          if [ "$OPEN_COUNT" -eq 0 ]; then
            echo "No open WinGet PRs found."
            echo "STATUS=none" >> $GITHUB_ENV
            exit 0
          fi

          echo "Found $OPEN_COUNT open PR(s):"
          echo "$OPEN_PRS" | jq -r '.[] | "  #\(.number): \(.title) (\(.createdAt))"'

          # Build summary
          SUMMARY=""
          NEEDS_ACTION=false

          for ROW in $(echo "$OPEN_PRS" | jq -c '.[]'); do
            PR_NUM=$(echo "$ROW" | jq -r '.number')
            PR_TITLE=$(echo "$ROW" | jq -r '.title')
            PR_URL=$(echo "$ROW" | jq -r '.url')
            PR_CREATED=$(echo "$ROW" | jq -r '.createdAt')

            # Calculate age in days
            CREATED_TS=$(date -d "$PR_CREATED" +%s 2>/dev/null) || CREATED_TS=0
            NOW_TS=$(date +%s)
            AGE_DAYS=$(( (NOW_TS - CREATED_TS) / 86400 ))

            STATUS_ICON="🟡"
            if [ "$AGE_DAYS" -gt 7 ]; then
              STATUS_ICON="🔴"
              NEEDS_ACTION=true
            elif [ "$AGE_DAYS" -gt 3 ]; then
              STATUS_ICON="🟠"
            fi

            SUMMARY="${SUMMARY}${STATUS_ICON} [#${PR_NUM}](${PR_URL}): **${PR_TITLE}** (${AGE_DAYS}d old)\n"
          done

          echo "STATUS=open" >> $GITHUB_ENV
          echo "PR_COUNT=$OPEN_COUNT" >> $GITHUB_ENV

          # Write summary to file for the next step
          printf "$SUMMARY" > /tmp/pr_summary.txt

          if [ "$NEEDS_ACTION" = true ]; then
            echo "NEEDS_ACTION=true" >> $GITHUB_ENV
          fi

      - name: Create or update tracking issue
        if: env.STATUS == 'open'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY=$(cat /tmp/pr_summary.txt)
          TODAY=$(date -u +%Y-%m-%d)
          ISSUE_TITLE="WinGet PR Status Tracker"

          # Find existing tracking issue
          EXISTING=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "winget-status" \
            --state open \
            --json number \
            --limit 1 \
            --jq '.[0].number // empty' 2>/dev/null) || true

          BODY="## WinGet PR Status — ${TODAY}

          ${PR_COUNT} open PR(s) on [microsoft/winget-pkgs](https://github.com/microsoft/winget-pkgs):

          ${SUMMARY}

          ---
          *Auto-updated by [WinGet PR Status](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.*"

          # Dedent the body
          BODY=$(echo "$BODY" | sed 's/^          //')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --repo ${{ github.repository }} \
              --body "$BODY"
            echo "Updated issue #$EXISTING"
          else
            gh issue create \
              --repo ${{ github.repository }} \
              --title "$ISSUE_TITLE" \
              --label "winget-status" \
              --body "$BODY"
            echo "Created new tracking issue"
          fi

      - name: Close tracking issue if no open PRs
        if: env.STATUS == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "winget-status" \
            --state open \
            --json number \
            --limit 1 \
            --jq '.[0].number // empty' 2>/dev/null) || true

          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --repo ${{ github.repository }} \
              --comment "All WinGet PRs have been merged or closed. Closing tracker."
            echo "Closed issue #$EXISTING"
          else
            echo "No tracking issue to close."
          fi

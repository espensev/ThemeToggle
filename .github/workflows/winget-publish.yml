# WinGet Auto-Publish Workflow
# Automatically submits a PR to microsoft/winget-pkgs after a GitHub release

name: Publish to WinGet

on:
  # Trigger when a GitHub Release is published
  release:
    types:
      - published

  # Trigger after release workflow completes (fallback for workflow_run)
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.6.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (validate only, do not submit PR)'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  publish:
    # Only run if release workflow succeeded (or manual/release event trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated release manifests
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: winget-manifests
          path: generated-release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Restore generated release manifests
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          Copy-Item "generated-release\VERSION" "VERSION" -Force
          Copy-Item "generated-release\winget\*.yaml" "winget\" -Force
        shell: pwsh

      - name: Get version from release
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            # Manual trigger - use input version
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.event_name }}" -eq "release") {
            # Release event - extract version from release tag (strip leading 'v')
            $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          } else {
            # workflow_run trigger - get version from VERSION file (restored from artifacts)
            $version = (Get-Content "VERSION" -Raw).Trim()
          }

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Publishing version: $version"
        shell: pwsh

      - name: Verify release exists
        id: release
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tag = "v$version"
          $releaseBase = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $installerUrl = "$releaseBase/ThemeToggle-Setup-$version.exe"
          $portableUrl = "$releaseBase/ThemeToggle-Portable.zip"
          $releaseAssets = @($installerUrl, $portableUrl)

          echo "Checking release: $tag"

          foreach ($assetUrl in $releaseAssets) {
            echo "Checking asset URL: $assetUrl"
            try {
              $response = Invoke-WebRequest -Uri $assetUrl -Method Head -UseBasicParsing -ErrorAction Stop
              echo "Release asset verified: HTTP $($response.StatusCode)"
            } catch {
              Write-Error "Release asset is not accessible: $assetUrl"
              Write-Error "Make sure the release exists and contains both installer and portable zip."
              exit 1
            }
          }

          echo "INSTALLER_URL=$installerUrl" >> $env:GITHUB_OUTPUT
          echo "PORTABLE_URL=$portableUrl" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Install wingetcreate
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"
          if (-not (Test-Path "wingetcreate.exe")) {
            Write-Error "Failed to download wingetcreate"
            exit 1
          }
          echo "wingetcreate installed successfully"
        shell: pwsh

      - name: Validate local WinGet manifests
        run: |
          .\tools\validate-winget.ps1 `
            -Version "${{ steps.version.outputs.VERSION }}" `
            -RepoSlug "${{ github.repository }}"
        shell: pwsh

      - name: Submit manifests and open PR
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $installerUrl = "${{ steps.release.outputs.INSTALLER_URL }}"
          $portableUrl = "${{ steps.release.outputs.PORTABLE_URL }}"
          $packageId = "SevIQ.ThemeToggle"
          $prTitle = "Update $packageId $version"

          if (-not $env:WINGET_GITHUB_TOKEN) {
            Write-Error "WINGET_GITHUB_TOKEN secret is not set!"
            Write-Error "Please create a GitHub PAT with 'public_repo' scope and add it as a repository secret."
            Write-Error "See: https://github.com/microsoft/winget-create#using-windows-package-manager-manifest-creator-in-github-actions"
            exit 1
          }

          echo "Submitting to WinGet..."
          echo "Package: $packageId"
          echo "Version: $version"
          echo "Installer: $installerUrl"
          echo "Portable: $portableUrl"
          echo "Manifest source: winget/"

          .\wingetcreate.exe submit `
            --prtitle $prTitle `
            --token $env:WINGET_GITHUB_TOKEN `
            winget

          if ($LASTEXITCODE -eq 0) {
            echo ""
            echo "=========================================="
            echo "SUCCESS: PR submitted to microsoft/winget-pkgs"
            echo "=========================================="
            echo ""
            echo "Check your GitHub notifications or visit:"
            echo "https://github.com/microsoft/winget-pkgs/pulls"
          } else {
            Write-Error "wingetcreate failed with exit code: $LASTEXITCODE"
            exit 1
          }
        shell: pwsh

      - name: Dry run (validate only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $installerUrl = "${{ steps.release.outputs.INSTALLER_URL }}"
          $portableUrl = "${{ steps.release.outputs.PORTABLE_URL }}"

          echo "DRY RUN - Validation only (no PR submission)."
          echo "Package: SevIQ.ThemeToggle"
          echo "Version: $version"
          echo "Installer: $installerUrl"
          echo "Portable: $portableUrl"
          echo ""
          echo "Validation succeeded in the previous step."
          echo "Manifests in winget/:"
          Get-ChildItem -Path winget -Filter "*.yaml" | ForEach-Object {
            echo "=== $($_.Name) ==="
            Get-Content $_.FullName
            echo ""
          }

        shell: pwsh

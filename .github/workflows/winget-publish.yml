# WinGet Auto-Publish Workflow
# Automatically submits a PR to microsoft/winget-pkgs after a GitHub release

name: Publish to WinGet

on:
  # Trigger after release workflow completes
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.6.0)'
        required: true
        type: string
      release_run_id:
        description: 'Optional Release workflow run ID to source manifests from'
        required: false
        type: string
      dry_run:
        description: 'Dry run (validate only, do not submit PR)'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  publish:
    # Only run if release workflow succeeded (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release manifest source
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
            $runId = "${{ github.event.workflow_run.id }}"
            $requestedVersion = ""
            echo "Using triggering Release workflow run: $runId"
          } else {
            $requestedVersion = "${{ inputs.version }}"
            if (-not $requestedVersion) {
              Write-Error "version input is required for manual publish runs."
              exit 1
            }

            if ("${{ inputs.release_run_id }}" -ne "") {
              $runId = "${{ inputs.release_run_id }}"
              echo "Using manually supplied Release workflow run: $runId"
            } else {
              $tag = "v$requestedVersion"
              $headers = @{
                Accept = "application/vnd.github+json"
                Authorization = "Bearer $env:GITHUB_TOKEN"
                "User-Agent" = "ThemeToggle-winget-publish"
                "X-GitHub-Api-Version" = "2022-11-28"
              }
              $url = "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/release.yml/runs?event=push&status=success&per_page=50"
              $response = Invoke-RestMethod -Uri $url -Headers $headers -ErrorAction Stop
              $matchingRun = @(
                $response.workflow_runs |
                  Where-Object { $_.head_branch -eq $tag -and $_.conclusion -eq "success" } |
                  Sort-Object created_at -Descending
              ) | Select-Object -First 1

              if (-not $matchingRun) {
                Write-Error "Could not find a successful Release workflow run for $tag. Supply release_run_id or rerun the Release workflow."
                exit 1
              }

              $runId = "$($matchingRun.id)"
              echo "Auto-selected Release workflow run $runId for $tag"
            }
          }

          echo "RUN_ID=$runId" >> $env:GITHUB_OUTPUT
          echo "REQUESTED_VERSION=$requestedVersion" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Download generated release manifests
        uses: actions/download-artifact@v8
        with:
          name: winget-manifests
          path: generated-release
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.RUN_ID }}

      - name: Restore generated release manifests
        run: |
          Copy-Item "generated-release\VERSION" "VERSION" -Force
          Copy-Item "generated-release\winget\*.yaml" "winget\" -Force
        shell: pwsh

      - name: Get version from manifest snapshot
        id: version
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          $requestedVersion = "${{ steps.source.outputs.REQUESTED_VERSION }}"

          if (-not $version) {
            Write-Error "VERSION file from release manifest snapshot is empty."
            exit 1
          }

          if ($requestedVersion -and $requestedVersion -ne $version) {
            Write-Error "Requested version ($requestedVersion) does not match the downloaded release manifest snapshot ($version)."
            exit 1
          }

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Publishing version from release manifest snapshot: $version"
        shell: pwsh

      - name: Verify release assets referenced by manifests
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tag = "v$version"
          $installerManifestPath = "winget\SevIQ.ThemeToggle.installer.yaml"
          $releaseBase = "https://github.com/${{ github.repository }}/releases/download/$tag/"

          if (-not (Test-Path $installerManifestPath)) {
            Write-Error "Installer manifest was not restored: $installerManifestPath"
            exit 1
          }

          $releaseAssets = @(
            [regex]::Matches((Get-Content $installerManifestPath -Raw), '(?m)^\s*InstallerUrl:\s*(\S+)\s*$') |
              ForEach-Object { $_.Groups[1].Value } |
              Select-Object -Unique
          )

          if ($releaseAssets.Count -lt 1) {
            Write-Error "No InstallerUrl entries were found in $installerManifestPath."
            exit 1
          }

          echo "Checking release: $tag"

          foreach ($assetUrl in $releaseAssets) {
            if (-not $assetUrl.StartsWith($releaseBase, [System.StringComparison]::OrdinalIgnoreCase)) {
              Write-Error "Manifest asset URL does not point to the expected release tag ($tag): $assetUrl"
              exit 1
            }

            echo "Checking asset URL: $assetUrl"
            try {
              $response = Invoke-WebRequest -Uri $assetUrl -Method Head -UseBasicParsing -ErrorAction Stop
              echo "Release asset verified: HTTP $($response.StatusCode)"
            } catch {
              Write-Error "Release asset is not accessible: $assetUrl"
              Write-Error "Make sure the release exists and contains the assets referenced by the WinGet manifest snapshot."
              exit 1
            }
          }
        shell: pwsh

      - name: Install wingetcreate
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"
          if (-not (Test-Path "wingetcreate.exe")) {
            Write-Error "Failed to download wingetcreate"
            exit 1
          }
          echo "wingetcreate installed successfully"
        shell: pwsh

      - name: Validate local WinGet manifests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .\tools\validate-winget.ps1 `
            -Version "${{ steps.version.outputs.VERSION }}" `
            -RepoSlug "${{ github.repository }}" `
            -VerifyGitHubReleaseDigests
        shell: pwsh

      - name: Submit manifests and open PR
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $packageId = "SevIQ.ThemeToggle"
          $prTitle = "Update $packageId $version"
          $manifestUrls = @(
            [regex]::Matches((Get-Content "winget\SevIQ.ThemeToggle.installer.yaml" -Raw), '(?m)^\s*InstallerUrl:\s*(\S+)\s*$') |
              ForEach-Object { $_.Groups[1].Value } |
              Select-Object -Unique
          )

          if (-not $env:WINGET_GITHUB_TOKEN) {
            Write-Error "WINGET_GITHUB_TOKEN secret is not set!"
            Write-Error "Please create a GitHub PAT with 'public_repo' scope and add it as a repository secret."
            Write-Error "See: https://github.com/microsoft/winget-create#using-windows-package-manager-manifest-creator-in-github-actions"
            exit 1
          }

          echo "Submitting to WinGet..."
          echo "Package: $packageId"
          echo "Version: $version"
          echo "Assets declared by manifests:"
          $manifestUrls | ForEach-Object { echo "  $_" }
          echo "Manifest source: winget/"

          .\wingetcreate.exe submit `
            --prtitle $prTitle `
            --token $env:WINGET_GITHUB_TOKEN `
            winget

          if ($LASTEXITCODE -eq 0) {
            echo ""
            echo "=========================================="
            echo "SUCCESS: PR submitted to microsoft/winget-pkgs"
            echo "=========================================="
            echo ""
            echo "Check your GitHub notifications or visit:"
            echo "https://github.com/microsoft/winget-pkgs/pulls"
          } else {
            Write-Error "wingetcreate failed with exit code: $LASTEXITCODE"
            exit 1
          }
        shell: pwsh

      - name: Dry run (validate only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $manifestUrls = @(
            [regex]::Matches((Get-Content "winget\SevIQ.ThemeToggle.installer.yaml" -Raw), '(?m)^\s*InstallerUrl:\s*(\S+)\s*$') |
              ForEach-Object { $_.Groups[1].Value } |
              Select-Object -Unique
          )

          echo "DRY RUN - Validation only (no PR submission)."
          echo "Package: SevIQ.ThemeToggle"
          echo "Version: $version"
          echo "Assets declared by manifests:"
          $manifestUrls | ForEach-Object { echo "  $_" }
          echo ""
          echo "Validation succeeded in the previous step."
          echo "Manifests in winget/:"
          Get-ChildItem -Path winget -Filter "*.yaml" | ForEach-Object {
            echo "=== $($_.Name) ==="
            Get-Content $_.FullName
            echo ""
          }

        shell: pwsh

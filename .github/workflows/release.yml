# Release Workflow
# Creates full release artifacts when a version tag is pushed

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "Releasing version: $version"
        shell: pwsh

      - name: Verify VERSION file matches tag
        run: |
          $expected = "${{ steps.version.outputs.VERSION }}"
          $actual = (Get-Content "VERSION" -Raw).Trim()

          if ($expected -ne $actual) {
            Write-Error "VERSION file ($actual) does not match tag ($expected)"
            exit 1
          }
          echo "Version verified: $actual"
        shell: pwsh

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Build release artifacts
        run: |
          call dist\build-release.bat
        shell: cmd

      - name: Calculate SHA256 hashes
        id: hashes
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $installer = "ThemeToggle-Setup-$version.exe"

          echo "SHA256 Hashes:"
          echo "=============="

          $exeHash = (Get-FileHash "ThemeToggle.exe" -Algorithm SHA256).Hash
          echo "ThemeToggle.exe: $exeHash"
          echo "EXE_SHA256=$exeHash" >> $env:GITHUB_OUTPUT

          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash
          echo "${installer}: $installerHash"
          echo "INSTALLER_SHA256=$installerHash" >> $env:GITHUB_OUTPUT

          $zipHash = (Get-FileHash "ThemeToggle-Portable.zip" -Algorithm SHA256).Hash
          echo "ThemeToggle-Portable.zip: $zipHash"
          echo "ZIP_SHA256=$zipHash" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Validate winget manifests
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $installerHash = "${{ steps.hashes.outputs.INSTALLER_SHA256 }}"

          echo "Validating WinGet manifests..."

          # Check installer manifest has correct SHA256
          $installerYaml = Get-Content "winget/SevIQ.ThemeToggle.installer.yaml" -Raw

          if ($installerYaml -match "InstallerSha256:\s*$installerHash") {
            echo "[OK] Installer SHA256 matches"
          } else {
            Write-Warning "Installer SHA256 in manifest does not match built artifact"
            Write-Warning "Expected: $installerHash"
            Write-Warning "Update manifest with: dist\update-winget.ps1"
          }

          # Check version
          if ($installerYaml -match "PackageVersion:\s*$version") {
            echo "[OK] Version matches: $version"
          } else {
            Write-Warning "Version mismatch in installer manifest"
          }

          # Check for placeholders
          if ($installerYaml -match "REPLACE_WITH") {
            Write-Error "Manifest contains placeholder values!"
            exit 1
          }

          echo "WinGet manifest validation complete"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ThemeToggle v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ThemeToggle.exe
            ThemeToggle-Setup-${{ steps.version.outputs.VERSION }}.exe
            ThemeToggle-Portable.zip
          body: |
            ## Downloads

            | File | Description | SHA256 |
            |------|-------------|--------|
            | `ThemeToggle.exe` | Standalone executable (~220 KB) | `${{ steps.hashes.outputs.EXE_SHA256 }}` |
            | `ThemeToggle-Setup-${{ steps.version.outputs.VERSION }}.exe` | NSIS Installer | `${{ steps.hashes.outputs.INSTALLER_SHA256 }}` |
            | `ThemeToggle-Portable.zip` | Portable package | `${{ steps.hashes.outputs.ZIP_SHA256 }}` |

            ## Installation

            ### WinGet (Recommended)
            ```
            winget install SevIQ.ThemeToggle
            ```

            ### Manual
            Download and run the installer, or extract the portable ZIP.

            ## Quick Start
            ```cmd
            ThemeToggle.exe           # Toggle current theme
            ThemeToggle.exe /light    # Force light mode
            ThemeToggle.exe /dark     # Force dark mode
            ```

            ## System Requirements
            - Windows 10 (1809+) or Windows 11
            - No admin rights required
            - No dependencies

# Release Workflow
# Creates full release artifacts when a version tag is pushed

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "Releasing version: $version"
        shell: pwsh

      - name: Ensure tag commit is reachable from main
        run: |
          $tag = "${{ github.ref_name }}"
          $tagCommit = (git rev-list -n 1 $tag).Trim()

          if (-not $tagCommit) {
            Write-Error "Could not resolve tag commit for $tag"
            exit 1
          }

          git fetch origin main --force
          & git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag $tag points to $tagCommit, which is not reachable from origin/main."
            exit 1
          }

          echo "Tag commit is reachable from origin/main: $tagCommit"
        shell: pwsh

      - name: Verify VERSION file matches tag
        run: |
          $expected = "${{ steps.version.outputs.VERSION }}"
          $actual = (Get-Content "VERSION" -Raw).Trim()

          if ($expected -ne $actual) {
            Write-Error "VERSION file ($actual) does not match tag ($expected)"
            exit 1
          }
          echo "Version verified: $actual"
        shell: pwsh

      - name: Require signing secrets
        env:
          THEMETOGGLE_SIGN_PFX_BASE64: ${{ secrets.THEMETOGGLE_SIGN_PFX_BASE64 }}
          THEMETOGGLE_SIGN_PFX_PASSWORD: ${{ secrets.THEMETOGGLE_SIGN_PFX_PASSWORD }}
          THEMETOGGLE_SIGN_CERT_THUMBPRINT: ${{ secrets.THEMETOGGLE_SIGN_CERT_THUMBPRINT }}
        run: |
          if (-not $env:THEMETOGGLE_SIGN_PFX_BASE64) {
            Write-Error "THEMETOGGLE_SIGN_PFX_BASE64 secret is not set."
            exit 1
          }

          if (-not $env:THEMETOGGLE_SIGN_PFX_PASSWORD) {
            Write-Error "THEMETOGGLE_SIGN_PFX_PASSWORD secret is not set."
            exit 1
          }

          if (-not $env:THEMETOGGLE_SIGN_CERT_THUMBPRINT) {
            Write-Error "THEMETOGGLE_SIGN_CERT_THUMBPRINT secret is not set."
            exit 1
          }
        shell: pwsh

      - name: Materialize signing certificate
        env:
          THEMETOGGLE_SIGN_PFX_BASE64: ${{ secrets.THEMETOGGLE_SIGN_PFX_BASE64 }}
          THEMETOGGLE_SIGN_PFX_PASSWORD: ${{ secrets.THEMETOGGLE_SIGN_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ThemeToggle-signing-cert.pfx"
          $pfxBytes = [System.Convert]::FromBase64String(($env:THEMETOGGLE_SIGN_PFX_BASE64 -replace '\s', ''))
          [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          Add-Content -Path $env:GITHUB_ENV -Value "THEMETOGGLE_SIGN_PFX_PATH=$pfxPath"
          Add-Content -Path $env:GITHUB_ENV -Value "THEMETOGGLE_SIGN_PFX_PASSWORD=$env:THEMETOGGLE_SIGN_PFX_PASSWORD"
          Write-Host "Signing certificate materialized for signtool."
        shell: pwsh

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build release artifacts
        env:
          THEMETOGGLE_SIGN_CERT_THUMBPRINT: ${{ secrets.THEMETOGGLE_SIGN_CERT_THUMBPRINT }}
        run: |
          .\tools\release\build-and-publish.ps1 -NoInstaller
        shell: pwsh

      - name: Verify Authenticode signature
        env:
          EXPECTED_THUMBPRINT: ${{ secrets.THEMETOGGLE_SIGN_CERT_THUMBPRINT }}
        run: |
          $file = "ThemeToggle.exe"
          $signature = Get-AuthenticodeSignature $file
          if (-not $signature.SignerCertificate) {
            Write-Error "$file has no signer certificate metadata."
            exit 1
          }

          $status = [string]$signature.Status
          $statusMessage = [string]$signature.StatusMessage
          $actualThumbprint = $signature.SignerCertificate.Thumbprint
          Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          Write-Host "$file thumbprint: $actualThumbprint"

          $expected = ($env:EXPECTED_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if (-not $expected) {
            Write-Error "EXPECTED_THUMBPRINT is empty. Tagged releases must pin the signing certificate thumbprint."
            exit 1
          }

          if ($actualThumbprint -ne $expected) {
            Write-Error "$file signed by unexpected certificate. Expected thumbprint: $expected, got: $actualThumbprint"
            exit 1
          }
          $thumbprintVerified = $true
          Write-Host "$file certificate thumbprint verified."

          if ($status -eq "Valid") {
            Write-Host "$file signature status is Valid."
            exit 0
          }

          $isExpectedSelfSignedTrustError = (
            $status -eq "UnknownError" -and
            $thumbprintVerified -and
            $statusMessage -like "*root certificate which is not trusted by the trust provider*"
          )

          if ($isExpectedSelfSignedTrustError) {
            Write-Warning "$file chain ends in an untrusted root on this runner, but the signer thumbprint matches the expected self-signed certificate."
            exit 0
          }

          Write-Error ("{0} signature status is {1}: {2}" -f $file, $status, $statusMessage)
          exit 1
        shell: pwsh

      - name: Resolve optional Artifact Signing configuration
        id: artifact_signing
        env:
          THEMETOGGLE_ARTIFACT_SIGNING_ENABLED: ${{ vars.THEMETOGGLE_ARTIFACT_SIGNING_ENABLED }}
          THEMETOGGLE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.THEMETOGGLE_ARTIFACT_SIGNING_ENDPOINT }}
          THEMETOGGLE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.THEMETOGGLE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          THEMETOGGLE_ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.THEMETOGGLE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
          THEMETOGGLE_ARTIFACT_SIGNING_AZURE_CLIENT_ID: ${{ secrets.THEMETOGGLE_ARTIFACT_SIGNING_AZURE_CLIENT_ID }}
          THEMETOGGLE_ARTIFACT_SIGNING_AZURE_TENANT_ID: ${{ secrets.THEMETOGGLE_ARTIFACT_SIGNING_AZURE_TENANT_ID }}
          THEMETOGGLE_ARTIFACT_SIGNING_AZURE_SUBSCRIPTION_ID: ${{ secrets.THEMETOGGLE_ARTIFACT_SIGNING_AZURE_SUBSCRIPTION_ID }}
        run: |
          $enabled = ([string]$env:THEMETOGGLE_ARTIFACT_SIGNING_ENABLED).Trim().ToLowerInvariant()
          if (-not $enabled) {
            $enabled = "false"
          }

          if ($enabled -notin @("true", "false")) {
            Write-Error "THEMETOGGLE_ARTIFACT_SIGNING_ENABLED must be 'true' or 'false' when set."
            exit 1
          }

          if ($enabled -eq "false") {
            Write-Host "Artifact Signing lane disabled; keeping the self-signed release path only."
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $required = @(
            @{ Name = "THEMETOGGLE_ARTIFACT_SIGNING_ENDPOINT"; Value = $env:THEMETOGGLE_ARTIFACT_SIGNING_ENDPOINT }
            @{ Name = "THEMETOGGLE_ARTIFACT_SIGNING_ACCOUNT_NAME"; Value = $env:THEMETOGGLE_ARTIFACT_SIGNING_ACCOUNT_NAME }
            @{ Name = "THEMETOGGLE_ARTIFACT_SIGNING_CERT_PROFILE_NAME"; Value = $env:THEMETOGGLE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }
            @{ Name = "THEMETOGGLE_ARTIFACT_SIGNING_AZURE_CLIENT_ID"; Value = $env:THEMETOGGLE_ARTIFACT_SIGNING_AZURE_CLIENT_ID }
            @{ Name = "THEMETOGGLE_ARTIFACT_SIGNING_AZURE_TENANT_ID"; Value = $env:THEMETOGGLE_ARTIFACT_SIGNING_AZURE_TENANT_ID }
            @{ Name = "THEMETOGGLE_ARTIFACT_SIGNING_AZURE_SUBSCRIPTION_ID"; Value = $env:THEMETOGGLE_ARTIFACT_SIGNING_AZURE_SUBSCRIPTION_ID }
          )

          $missing = @($required | Where-Object { -not ([string]$_.Value).Trim() } | ForEach-Object { $_.Name })
          if ($missing.Count -gt 0) {
            Write-Error ("Artifact Signing is enabled, but the following settings are missing: {0}" -f ($missing -join ", "))
            exit 1
          }

          Write-Host "Artifact Signing lane enabled."
          "enabled=true" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Azure login for Artifact Signing
        if: steps.artifact_signing.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.THEMETOGGLE_ARTIFACT_SIGNING_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.THEMETOGGLE_ARTIFACT_SIGNING_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.THEMETOGGLE_ARTIFACT_SIGNING_AZURE_SUBSCRIPTION_ID }}

      - name: Append Artifact Signing signature
        if: steps.artifact_signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ vars.THEMETOGGLE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.THEMETOGGLE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.THEMETOGGLE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
          files: ${{ github.workspace }}\ThemeToggle.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: true
          description: ThemeToggle
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Refresh portable package after Artifact Signing
        if: steps.artifact_signing.outputs.enabled == 'true'
        run: |
          .\tools\release\refresh-portable-package.ps1 `
            -Version "${{ steps.version.outputs.VERSION }}" `
            -RepoSlug "${{ github.repository }}"
        shell: pwsh

      - name: Calculate SHA256 hashes
        id: hashes
        run: |
          echo "SHA256 Hashes:"
          echo "=============="

          $exeHash = (Get-FileHash "ThemeToggle.exe" -Algorithm SHA256).Hash
          echo "ThemeToggle.exe: $exeHash"
          echo "EXE_SHA256=$exeHash" >> $env:GITHUB_OUTPUT

          $zipHash = (Get-FileHash "ThemeToggle-Portable.zip" -Algorithm SHA256).Hash
          echo "ThemeToggle-Portable.zip: $zipHash"
          echo "ZIP_SHA256=$zipHash" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Validate winget manifests
        run: |
          .\tools\validate-winget.ps1 `
            -Version "${{ steps.version.outputs.VERSION }}" `
            -RepoSlug "${{ github.repository }}" `
            -VerifyLocalArtifacts
        shell: pwsh

      - name: Stage generated WinGet manifests
        run: |
          if (Test-Path "release-inputs") {
            Remove-Item "release-inputs" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "release-inputs\winget" -Force | Out-Null
          Copy-Item "VERSION" "release-inputs\VERSION" -Force
          Copy-Item "winget\*.yaml" "release-inputs\winget\" -Force
        shell: pwsh

      - name: Upload generated WinGet manifests
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: |
            release-inputs/VERSION
            release-inputs/winget/*.yaml
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ThemeToggle v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ThemeToggle.exe
            ThemeToggle-Portable.zip
          body: |
            ## Downloads

            | File | Description | SHA256 |
            |------|-------------|--------|
            | `ThemeToggle.exe` | Signed standalone executable | `${{ steps.hashes.outputs.EXE_SHA256 }}` |
            | `ThemeToggle-Portable.zip` | Portable package (includes signed exe) | `${{ steps.hashes.outputs.ZIP_SHA256 }}` |

            ## Installation

            ### WinGet
            ```
            winget install SevIQ.ThemeToggle
            ```
            Availability follows the corresponding `microsoft/winget-pkgs` PR merge.

            ### Manual (Available Immediately)
            Download the portable ZIP and extract, or use the standalone exe directly.

            ## Quick Start
            ```cmd
            ThemeToggle.exe           # Toggle current theme
            ThemeToggle.exe /light    # Force light mode
            ThemeToggle.exe /dark     # Force dark mode
            ```

            ## System Requirements
            - Windows 10 (1809+) or Windows 11
            - No admin rights required
            - No dependencies

      - name: Remove signing certificate
        if: always()
        run: |
          # Remove PFX file from disk
          if ($env:THEMETOGGLE_SIGN_PFX_PATH -and (Test-Path $env:THEMETOGGLE_SIGN_PFX_PATH)) {
            Remove-Item $env:THEMETOGGLE_SIGN_PFX_PATH -Force
            Write-Host "Removed PFX file."
          }
        shell: pwsh

# Release Workflow
# Creates full release artifacts when a version tag is pushed

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "Releasing version: $version"
        shell: pwsh

      - name: Ensure tag commit is reachable from main
        run: |
          $tag = "${{ github.ref_name }}"
          $tagCommit = (git rev-list -n 1 $tag).Trim()

          if (-not $tagCommit) {
            Write-Error "Could not resolve tag commit for $tag"
            exit 1
          }

          git fetch origin main --force
          & git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag $tag points to $tagCommit, which is not reachable from origin/main."
            exit 1
          }

          echo "Tag commit is reachable from origin/main: $tagCommit"
        shell: pwsh

      - name: Verify VERSION file matches tag
        run: |
          $expected = "${{ steps.version.outputs.VERSION }}"
          $actual = (Get-Content "VERSION" -Raw).Trim()

          if ($expected -ne $actual) {
            Write-Error "VERSION file ($actual) does not match tag ($expected)"
            exit 1
          }
          echo "Version verified: $actual"
        shell: pwsh

      - name: Require signing secrets
        env:
          THEMETOGGLE_SIGN_PFX_BASE64: ${{ secrets.THEMETOGGLE_SIGN_PFX_BASE64 }}
          THEMETOGGLE_SIGN_PFX_PASSWORD: ${{ secrets.THEMETOGGLE_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:THEMETOGGLE_SIGN_PFX_BASE64) {
            Write-Error "THEMETOGGLE_SIGN_PFX_BASE64 secret is not set."
            exit 1
          }

          if (-not $env:THEMETOGGLE_SIGN_PFX_PASSWORD) {
            Write-Error "THEMETOGGLE_SIGN_PFX_PASSWORD secret is not set."
            exit 1
          }
        shell: pwsh

      - name: Materialize signing certificate
        env:
          THEMETOGGLE_SIGN_PFX_BASE64: ${{ secrets.THEMETOGGLE_SIGN_PFX_BASE64 }}
          THEMETOGGLE_SIGN_PFX_PASSWORD: ${{ secrets.THEMETOGGLE_SIGN_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ThemeToggle-signing-cert.pfx"
          $pfxBytes = [System.Convert]::FromBase64String(($env:THEMETOGGLE_SIGN_PFX_BASE64 -replace '\s', ''))
          [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          # Import the signing cert into the runner's trusted root store so
          # Get-AuthenticodeSignature returns "Valid" instead of "UnknownError"
          # for self-signed certificates.
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            $pfxPath, $env:THEMETOGGLE_SIGN_PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet
          )
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store(
            "Root", "CurrentUser"
          )
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          $cert.Dispose()
          Write-Host "Signing certificate imported into CurrentUser\Root trust store."

          Add-Content -Path $env:GITHUB_ENV -Value "THEMETOGGLE_SIGN_PFX_PATH=$pfxPath"
          Add-Content -Path $env:GITHUB_ENV -Value "THEMETOGGLE_SIGN_PFX_PASSWORD=$env:THEMETOGGLE_SIGN_PFX_PASSWORD"
        shell: pwsh

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build release artifacts
        run: |
          .\tools\release\build-and-publish.ps1 -NoInstaller
        shell: pwsh

      - name: Verify Authenticode signature
        env:
          EXPECTED_THUMBPRINT: ${{ secrets.THEMETOGGLE_SIGN_CERT_THUMBPRINT }}
        run: |
          $file = "ThemeToggle.exe"
          $signature = Get-AuthenticodeSignature $file
          if ($signature.Status -ne "Valid") {
            Write-Error "$file signature status is $($signature.Status): $($signature.StatusMessage)"
            exit 1
          }

          if (-not $signature.SignerCertificate) {
            Write-Error "$file has a valid status but no signer certificate metadata."
            exit 1
          }

          $actualThumbprint = $signature.SignerCertificate.Thumbprint
          Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          Write-Host "$file thumbprint: $actualThumbprint"

          if ($env:EXPECTED_THUMBPRINT) {
            $expected = ($env:EXPECTED_THUMBPRINT -replace '\s', '').ToUpperInvariant()
            if ($actualThumbprint -ne $expected) {
              Write-Error "$file signed by unexpected certificate. Expected thumbprint: $expected, got: $actualThumbprint"
              exit 1
            }
            Write-Host "$file certificate thumbprint verified."
          } else {
            Write-Warning "THEMETOGGLE_SIGN_CERT_THUMBPRINT secret not set — skipping signer identity check."
          }
        shell: pwsh

      - name: Calculate SHA256 hashes
        id: hashes
        run: |
          echo "SHA256 Hashes:"
          echo "=============="

          $exeHash = (Get-FileHash "ThemeToggle.exe" -Algorithm SHA256).Hash
          echo "ThemeToggle.exe: $exeHash"
          echo "EXE_SHA256=$exeHash" >> $env:GITHUB_OUTPUT

          $zipHash = (Get-FileHash "ThemeToggle-Portable.zip" -Algorithm SHA256).Hash
          echo "ThemeToggle-Portable.zip: $zipHash"
          echo "ZIP_SHA256=$zipHash" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Validate winget manifests
        run: |
          .\tools\validate-winget.ps1 `
            -Version "${{ steps.version.outputs.VERSION }}" `
            -RepoSlug "${{ github.repository }}" `
            -VerifyLocalArtifacts
        shell: pwsh

      - name: Stage generated WinGet manifests
        run: |
          if (Test-Path "release-inputs") {
            Remove-Item "release-inputs" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "release-inputs\winget" -Force | Out-Null
          Copy-Item "VERSION" "release-inputs\VERSION" -Force
          Copy-Item "winget\*.yaml" "release-inputs\winget\" -Force
        shell: pwsh

      - name: Upload generated WinGet manifests
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: |
            release-inputs/VERSION
            release-inputs/winget/*.yaml
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ThemeToggle v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ThemeToggle.exe
            ThemeToggle-Portable.zip
          body: |
            ## Downloads

            | File | Description | SHA256 |
            |------|-------------|--------|
            | `ThemeToggle.exe` | Signed standalone executable | `${{ steps.hashes.outputs.EXE_SHA256 }}` |
            | `ThemeToggle-Portable.zip` | Portable package (includes signed exe) | `${{ steps.hashes.outputs.ZIP_SHA256 }}` |

            ## Installation

            ### WinGet (Recommended)
            ```
            winget install SevIQ.ThemeToggle
            ```

            ### Manual
            Download the portable ZIP and extract, or use the standalone exe directly.

            ## Quick Start
            ```cmd
            ThemeToggle.exe           # Toggle current theme
            ThemeToggle.exe /light    # Force light mode
            ThemeToggle.exe /dark     # Force dark mode
            ```

            ## System Requirements
            - Windows 10 (1809+) or Windows 11
            - No admin rights required
            - No dependencies

      - name: Remove signing certificate
        if: always()
        env:
          THEMETOGGLE_SIGN_CERT_THUMBPRINT: ${{ secrets.THEMETOGGLE_SIGN_CERT_THUMBPRINT }}
        run: |
          # Remove PFX file from disk
          if ($env:THEMETOGGLE_SIGN_PFX_PATH -and (Test-Path $env:THEMETOGGLE_SIGN_PFX_PATH)) {
            Remove-Item $env:THEMETOGGLE_SIGN_PFX_PATH -Force
            Write-Host "Removed PFX file."
          }

          # Remove cert from trust store
          if ($env:THEMETOGGLE_SIGN_CERT_THUMBPRINT) {
            $thumbprint = ($env:THEMETOGGLE_SIGN_CERT_THUMBPRINT -replace '\s', '')
            $store = New-Object System.Security.Cryptography.X509Certificates.X509Store(
              "Root", "CurrentUser"
            )
            $store.Open("ReadWrite")
            $certs = $store.Certificates | Where-Object { $_.Thumbprint -eq $thumbprint }
            foreach ($c in $certs) { $store.Remove($c) }
            $store.Close()
            Write-Host "Removed certificate from CurrentUser\Root trust store."
          }
        shell: pwsh

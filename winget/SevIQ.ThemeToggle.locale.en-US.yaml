ReleaseNotes: |-
  1.5.7 is a release reliability and packaging update:
  - No CLI behavior changes
  - GitHub release signing verification now checks the expected signer thumbprint and handles the known self-signed runner trust error
  - WinGet submission now restores the CI-generated manifest snapshot and validates the exact published asset URLs
  - Release validation now stays aligned with the published ThemeToggle.exe and ThemeToggle-Portable.zip artifacts

  Observed toggle duration on test systems remains around 10-15 ms.

  See full changelog at: https://github.com/espensev/ThemeToggle/blob/main/docs/RELEASE_NOTES.md

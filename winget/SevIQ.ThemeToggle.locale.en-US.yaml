ReleaseNotes: |-
  CLI and automation update:
  - GUI launches no longer show result or error dialogs
  - /notify is kept as a backward-compatible no-op
  - Stdout/stderr behavior is preserved when redirected or piped
  - PowerShell launcher supports -Wait
  - Benchmark script supports 1000-toggle runs with CSV output

  Observed toggle duration on test systems remains around 10-15 ms.

  See full changelog at: https://github.com/espensev/ThemeToggle/blob/main/docs/RELEASE_NOTES.md

ShortDescription: Windows light/dark theme switcher with CLI automation support
Description: |-
  ThemeToggle is a command-line utility for switching Windows between light and
  dark themes. It is designed for scripts, hotkeys, and scheduled automation.
  On test systems, observed toggle duration is typically around 10-15 ms.

  Features:
  - CLI operations for /toggle, /light, and /dark
  - Quiet mode for automation and launcher-friendly direct execution
  - Hotkey launchers (VBScript and PowerShell)
  - Task Scheduler friendly invocation for time-based switching
  - Compatibility handling for common apps that ignore theme broadcasts
  - Multi-monitor taskbar support
  - Installer and portable package variants
  - No runtime dependencies
  - Benchmark tooling for repeated runs (for example 1000 toggles) with CSV logging
